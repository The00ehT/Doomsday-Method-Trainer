<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wochentag-Trainer</title>
<meta name="description" content="Wochentage beliebiger Daten im Kopf berechnen (Doomsday-Methode) – mit Statistik, Fehleranalyse und Erfolgen.">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1520" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wochentag">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<style>
/* Layout: one-screen phone app — date "card" as hero, 7-key weekday pad, bottom tab bar (Trainieren / Statistik / Zeitraum) */
:root{
  --paper:#f4f6f8; --sheet:#ffffff; --ink:#152238; --muted:#5d6b80; --line:#dbe1e9;
  --accent:#c8312b; --accent-ink:#ffffff; --good:#1f7a4d; --bad:#c8312b; --soft:#e9edf3;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:var(--body);
  --mono:var(--body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1520; --sheet:#172030; --ink:#e7ecf3; --muted:#93a1b5; --line:#283447;
  --accent:#ef5a4f; --accent-ink:#1a0806; --good:#4fc28a; --bad:#ef5a4f; --soft:#1e293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1520; --sheet:#172030; --ink:#e7ecf3; --muted:#93a1b5; --line:#283447;
  --accent:#ef5a4f; --accent-ink:#1a0806; --good:#4fc28a; --bad:#ef5a4f; --soft:#1e293a; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--body);font-weight:600;font-size:18px;margin:0}
header.top svg{width:32px;height:32px;flex:none}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:16px}

/* Date card: styled as a tear-off calendar leaf */
.leaf{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(10,20,40,.35)}
.leaf-top{background:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.leaf-top .timer{font-family:var(--mono);letter-spacing:0;font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.leaf-body{padding:18px 14px 20px;text-align:center;display:flex;align-items:center;justify-content:center;min-height:130px}
.date-line{font-family:var(--body);font-weight:600;font-size:clamp(22px,7.4vw,36px);line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.date-line.count{font-size:64px;color:var(--accent);font-weight:500}

.pad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pad button{font:inherit;font-weight:600;font-size:22px;padding:22px 4px;min-height:72px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;transition:transform .08s ease, background .15s}
.pad button:nth-child(7){grid-column:1 / -1}
.pad button:active{transform:scale(.97)}
.pad button.ok{background:var(--good);border-color:var(--good);color:#fff}
.pad button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.pad button:disabled{cursor:default}
.next{margin-left:auto;font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
.next:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.feedback{min-height:64px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feedback .verdict{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.feedback .verdict .t{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.feedback .how{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.feedback.idle{visibility:hidden}
.v-good{color:var(--good)} .v-bad{color:var(--bad)}

body.lock{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body.lock .app{height:100dvh;box-sizing:border-box;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body.lock #v-train{flex:1;min-height:0;gap:10px}
#v-train .pad{margin-top:auto}
#v-train .pad button{padding:0 4px;min-height:clamp(46px,8dvh,72px)}
#v-train .leaf-body{min-height:clamp(78px,14dvh,124px);padding:10px 14px}
#v-train .feedback{min-height:0;flex:none}
#v-train .leaf{flex:none}
@media (max-height:720px){
  .app{gap:10px;padding-top:10px}
  body.lock #v-train{gap:8px}
  #v-train .leaf-top{padding:5px 14px}
  #v-train .leaf-body{min-height:52px;padding:6px 14px}
  #v-train .date-line{font-size:clamp(20px,6.4vw,28px)}
  #v-train .feedback{padding:8px 12px;gap:2px}
  #v-train .feedback .how{gap:3px}
  #v-train .how .st{line-height:1.3}
  #v-train .pad{gap:8px}
  #v-train .pad button{min-height:40px;font-size:19px}
}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.kv span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}

/* Stats */
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-size:13px;padding:7px 4px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.daily{display:flex;flex-direction:column;gap:10px}
.daily-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.daily-top b{font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.daily-top b small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.daily-top em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.dstrip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.dstrip div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--muted)}
.dstrip i{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--soft);border:1px solid var(--line);box-sizing:border-box}
.dstrip .on i{background:var(--good);border-color:var(--good)}
.dstrip .today i{outline:2px solid var(--ink);outline-offset:1px}
.dstrip .today{color:var(--ink);font-weight:600}
.dstrip{-webkit-user-select:none;user-select:none;cursor:pointer}
.dstrip i{display:flex!important;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.dstrip .sel i{outline:2px solid var(--accent);outline-offset:1px;transform:scale(1.12)}
.dstrip .sel:not(.on) i{color:var(--muted)}
.dstrip .sel{color:var(--accent);font-weight:700}
.recent .mk{font-size:12px;line-height:1}
.dinfo{font-size:13px;background:var(--soft);border-radius:8px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile b{font-family:var(--mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.card p.note{margin:0;font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.grid-l{stroke:var(--line);stroke-width:1}
.wd-row{display:grid;grid-template-columns:34px 1fr 54px 52px;gap:8px;align-items:center;font-size:13px}
.wd-row .num{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.wd-row .muted{color:var(--muted)}
.recent{display:flex;flex-direction:column}
.recent div{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.recent div:first-child{border-top:0}
.recent .d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.recent .w{color:var(--muted);font-size:12px}
.recent .ms{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--ink);font-weight:600;font-size:18px}

.how{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.how .st{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-family:var(--mono);font-size:12px;line-height:1.5}
.how .st i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.how .st span{color:var(--muted)}
.how .st b{font-weight:500;color:var(--ink);text-align:right}
.how .st.last b{color:var(--accent);font-weight:600}

.seg.sm button{font-size:12px;padding:7px 2px}
.insight{margin:0;font-size:13px}
.io-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.io-row .btn{width:100%;text-align:center;padding:11px 8px;box-sizing:border-box;font-size:14px}
#statsBody,#achBody{display:flex;flex-direction:column;gap:16px}
svg.scrub{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.tip{min-height:3.4em;font-size:13px;background:var(--soft);border-radius:8px;padding:7px 10px;line-height:1.4}
.tip small{display:block;color:var(--muted);font-size:12px}
.tip .big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.seg.mini{padding:2px;gap:2px}.seg.mini button{font-size:12px;padding:4px 10px;flex:none}
.srcs{display:flex;flex-direction:column;gap:10px}
.src{display:flex;flex-direction:column;gap:3px}
.src-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.src-h b{font-weight:500}.src-h span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.src.top .src-h b{font-weight:700;color:var(--bad)}
.src .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.src .bar i{display:block;height:100%;border-radius:4px;background:var(--muted)}
.src.top .bar i{background:var(--bad)}
.src small{font-size:11px;color:var(--muted)}
.devs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;text-align:center}
.devs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.devs i{display:block;width:70%;min-height:2px;border-radius:3px 3px 0 0;background:var(--bad);opacity:.85}
.devs b{font-weight:600;font-size:12px}.devs span{color:var(--muted)}
.recent .rank{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
#drillBtn{align-self:flex-start}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.field{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=date],input[type=number],select{font:inherit;font-family:var(--mono);font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);width:100%;min-width:0;box-sizing:border-box}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button,.btn{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;margin:0}
.store{font-size:12px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
/* feedback motion */
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--good) 0%,transparent)}}
@keyframes leafglow{0%{border-color:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 18px color-mix(in srgb,var(--good) 0%,transparent)}}
.shake{animation:shake .4s ease}
.pad button.glow{animation:glow .65s ease-out}
.leaf.glow{animation:leafglow .7s ease-out}

/* achievements */
.march{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;align-items:end;border-bottom:2px solid var(--line);padding-bottom:2px}
.march button{font:inherit;background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 0 4px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.march svg{width:100%;max-width:64px;height:auto;display:block}
.march .done{color:var(--ink)} .march .now{color:var(--accent)}
.march .next svg{opacity:.5} .march .locked svg{opacity:.2}
.march button[aria-pressed="true"]{background:var(--soft);border-color:var(--line)}
.march small{font-size:10px;line-height:1.2;text-align:center;max-width:100%;min-height:2.4em;hyphens:manual;letter-spacing:-.01em}
.march .now small,.march .done small{font-weight:600}
.evo-bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.evo-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.evo-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stage-h h3{margin:0;font-size:17px;font-weight:600}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.go{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:13px}
.req .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-sizing:border-box}
.req.ok .ck{background:var(--good);border-color:var(--good)}
.req .v{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.req .mb{grid-column:2 / -1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.req .mb i{display:block;height:100%;background:var(--muted);border-radius:2px}
.req.ok .mb i{background:var(--good)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.badge svg{width:62px;height:62px}
.badge b{font-size:12px;line-height:1.25}
.badge span{font-size:11px;color:var(--muted);line-height:1.3}
.badge .bv{font-family:var(--mono);font-size:10px}
.badge.lock b{color:var(--muted);font-weight:500}
.badge:not(.lock) svg{filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--accent) 30%,transparent))}
.toast{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);touch-action:none;width:min(520px,calc(100% - 24px));opacity:0;pointer-events:none;z-index:9;
  background:var(--ink);color:var(--paper);border:0;font:inherit;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);transition:opacity .25s,transform .25s;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left}
.toast:not(.show){visibility:hidden;transition:opacity .25s,transform .25s,visibility 0s .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.drag{transition:none}
.toast small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.toast em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.pad button{font-size:19px;padding:18px 2px;min-height:62px}}
</style>

<div class="app">
  <header class="top">

="6" height="6" rx="1.5" style="fill:var(--muted);opacity:.4"/><g style="stroke:var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"><circle cx="40.2" cy="39.8" r="7.5"/><path d="M40.2 28.8v5M40.2 45.8v5M29.2 39.8h5M46.2 39.8h5"/></g></svg>

<button class="toast" id="toast" type="button" aria-live="polite"></button>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
/* ---------- language (Deutsch / English) ---------- */
const I18N={
  de:{WD:["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"],WDS:["Mo","Di","Mi","Do","Fr","Sa","So"],
      MONS:["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],
      MON:["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"]},
  en:{WD:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],WDS:["Mo","Tu","We","Th","Fr","Sa","Su"],
      MONS:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
      MON:["January","February","March","April","May","June","July","August","September","October","November","December"]}};
let LANG="de", WD, WDS, MONS, MON;
const tr=(de,en)=>LANG==="en"?en:de;
const loc=()=>LANG==="en"?"en-US":"de-DE";
function setNames(){ ({WD,WDS,MONS,MON}=I18N[LANG]); }
const fmtS = ms => (ms/1000).toLocaleString(loc(),{minimumFractionDigits:1,maximumFractionDigits:1}) + " s";
const pct = x => Math.round(x*100) + (LANG==="en"?"%":" %");
const fmtD = s => { const [y,m,d]=s.split("-").map(Number); return LANG==="en"?`${MONS[m-1]} ${d}, ${y}`:`${String(d).padStart(2,"0")}.${String(m).padStart(2,"0")}.${y}`; };
const longDate = dt => LANG==="en"?`${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}, ${dt.getUTCFullYear()}`:`${dt.getUTCDate()}. ${MON[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
const cSuf = () => tr("er","s");

/* ---------- local prefs (per device convenience) ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem("wt."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("wt."+k,JSON.stringify(v))}catch(e){}}
};
const prefs = Object.assign({from:"1900-01-01",to:"2099-12-31",auto:true,how:true,cd:3,theme:"system",lang:/^de/i.test(navigator.language||"de")?"de":"en"}, LS.get("prefs",{}));
LANG=prefs.lang==="en"?"en":"de"; setNames();

/* ---------- date math (UTC, proleptic Gregorian) ---------- */
function parseISO(s){const [y,m,d]=s.split("-").map(Number);const t=new Date(0);t.setUTCFullYear(y,m-1,d);t.setUTCHours(0,0,0,0);return t}
function iso(dt){return String(dt.getUTCFullYear()).padStart(4,"0")+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}
const monIdx = dt => (dt.getUTCDay()+6)%7; // 0 = Montag
function randomDate(){
  const a=parseISO(prefs.from).getTime(), b=parseISO(prefs.to).getTime();
  const days=Math.round((b-a)/864e5);
  return new Date(a + Math.floor(Math.random()*(days+1))*864e5);
}
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
function doomsdayWay(dt){
  const Y=dt.getUTCFullYear(), M=dt.getUTCMonth(), D=dt.getUTCDate();
  const c=Math.floor(Y/100), y=Y%100;
  const anchor=(5*(c%4)+2)%7; // 0=So
  const a=Math.floor(y/12), b=y%12, cc=Math.floor(b/4);
  const sum=a+b+cc, dd=(anchor+sum)%7;
  const md=[isLeap(Y)?4:3, isLeap(Y)?29:28, 14,4,9,6,11,8,5,10,7,12][M];
  const diff=D-md, off=((diff%7)+7)%7;
  const day = i => WDS[(i+6)%7];
  const st=(n,l,r,cls)=>`<div class="st${cls||""}"><i>${n}</i><span>${l}</span><b>${r}</b></div>`;
  return `<div class="how">`+
    st(1,`${tr("Jahrhundert","Century")} ${c}00`,`${tr("Anker","Anchor")} ${day(anchor)}`)+
    st(2,`${tr("Jahr","Year")} ${String(y).padStart(2,"0")}: ${a} + ${b} + ${cc} = ${sum}`,`${day(anchor)} + ${sum%7} = ${day(dd)}`)+
    st(3,tr(`Merktag im ${MON[M]}`,`Doomsday in ${MON[M]}`),`${tr(`${md}.${M+1}.`,`${M+1}/${md}`)} = ${day(dd)}`)+
    st(4,`${D} − ${md} = ${diff}${off!==diff?` ≡ ${off}`:""}`,`${day(dd)} + ${off} = ${day((dd+off)%7)}`," last")+
  `</div>`;
}

/* ---------- storage: db (account, synced) with localStorage fallback ---------- */
let attempts = [];             // [{t,d,c,a,ms}]
let months = {};               // key -> array of tuples [t,d,c,a,ms]
let pending = [];              // tuples written locally, not yet confirmed
let mode = "local", db=null, uid=null, loadTimer=null, stale=false;
const keyOf = t => { const d=new Date(t); return "m-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
function rebuild(){
  const all=[]; for(const k in months) for(const r of months[k]) all.push(r);
  const seen=new Set(); attempts=[];
  all.sort((x,y)=>x[0]-y[0]).forEach(r=>{ if(seen.has(r[0]))return; seen.add(r[0]); attempts.push({t:r[0],d:r[1],c:r[2],a:r[3],ms:r[4]}); });
  computeAch(); renderStats(); renderDataNote(); if(!$("v-ach").hidden) renderAch();
}
function loadLocal(){ months = LS.get("months",{}); rebuild(); }
function saveLocal(){ LS.set("months",months); }

let chain = Promise.resolve();
function persist(key){
  if(mode!=="db"){ saveLocal(); return; }
  chain = chain.then(async () => {
    const list = months[key] || [];
    const snapshot = list.slice();
    try{
      await db.collection("data/users/"+uid).doc(key).set({v:1,list:snapshot});
      const done=new Set(snapshot.map(r=>r[0]));
      pending = pending.filter(r=>!done.has(r[0]));
    }catch(e){
      if(e && e.code==="quota_exceeded") showStoreErr(tr("Der Speicher ist voll. Lösche alte Statistik unter „Einstellungen“.","Storage is full. Delete old statistics under “Settings”."));
      else if(e && e.code==="invalid_argument"){ mode="local"; saveLocal(); renderDataNote(); }
    }
  });
}
function addAttempt(r){
  const k=keyOf(r[0]);
  (months[k] ||= []).push(r);
  if(mode==="db") pending.push(r);
  saveLocal(); // offline copy on this device
  persist(k);
  rebuild();
}
function showStoreErr(msg){ $("storeNote").textContent=msg; }

async function initDb(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    const id = await u.id();
    if(!id) return;
    db=d; uid=id; mode="db";
    renderDataNote();
    loadTimer = setTimeout(()=>{ stale=true; renderDataNote(); }, 10000);
    let migrated=false;
    db.collection("data/users/"+uid).onSnapshot(snap => {
      const fresh={};
      snap.docs.forEach(doc=>{ const b=doc.data(); if(b && Array.isArray(b.list)) fresh[doc.id]=b.list.slice(); });
      for(const r of pending){ const k=keyOf(r[0]); const arr=(fresh[k] ||= []); if(!arr.some(x=>x[0]===r[0])) arr.push(r); }
      if(!snap.metadata.fromCache){
        clearTimeout(loadTimer); stale=false;
        if(!migrated){ migrated=true;
          // move results that were only saved on this device into the account
          const local=LS.get("months",{});
          for(const k in local){ const arr=(fresh[k] ||= []); let add=false;
            for(const r of local[k]) if(!arr.some(x=>x[0]===r[0])){ arr.push(r); pending.push(r); add=true; }
            if(add){ months=fresh; persist(k); } }
        }
      }
      months=fresh; saveLocal(); rebuild();
    }, () => { clearTimeout(loadTimer); mode="local"; loadLocal(); renderDataNote(); });
  }catch(e){ /* stay local */ }
}

/* ---------- training ---------- */
let cur=null, t0=0, raf=0, answered=false, nextTimer=0;
const pad=$("pad");
WD.forEach((w,i)=>{
  const b=document.createElement("button"); b.type="button"; b.dataset.i=i;
  b.addEventListener("click",()=>answer(i)); pad.appendChild(b);
});
function labelPad(){ pad.querySelectorAll("button[data-i]").forEach(b=>{ const i=+b.dataset.i; b.textContent=WDS[i]; b.setAttribute("aria-label",WD[i]); }); }
labelPad();
const nextBtn=$("nextBtn"); nextBtn.addEventListener("click",()=>newRound());

function tick(){ $("timer").textContent=fmtS(performance.now()-t0); raf=requestAnimationFrame(tick); }
let counting=false, cdTimer=0;
function stopAll(){ clearTimeout(nextTimer); clearTimeout(cdTimer); cancelAnimationFrame(raf); counting=false; }
function setPadEnabled(on){ pad.querySelectorAll("button[data-i]").forEach(b=>{b.classList.remove("ok","no","glow","shake");b.disabled=!on}); }
function fx(el,cls){ el.classList.remove("glow","shake"); void el.offsetWidth; el.classList.add(cls); }
// Countdown 3-2-1, then the date appears and the clock starts
function newRound(){
  stopAll(); cur=null; answered=false; counting=true;
  setPadEnabled(false); nextBtn.disabled=true;
  $("leafLabel").textContent=tr("Gleich geht's los","Get ready"); $("timer").textContent=fmtS(0);
  const line=$("dLine"); let n=+prefs.cd||0;
  if(!n) $("leafLabel").textContent=tr("Welcher Wochentag?","Which weekday?");
  const step=()=>{
    if(n>0){ line.className="date-line count"; line.textContent=n; n--; cdTimer=setTimeout(step,1000); return; }
    counting=false; nextBtn.disabled=false;
    const dr=drill.length; cur=dr?parseISO(drill.shift()):randomDate();
    line.className="date-line";
    line.textContent=longDate(cur);
    $("leafLabel").textContent=dr?tr(`Nachüben ${drillN-drill.length} von ${drillN}`,`Practice ${drillN-drill.length} of ${drillN}`):tr("Welcher Wochentag?","Which weekday?");
    setPadEnabled(true);
    t0=performance.now(); tick();
  };
  step();
}
function fbIdle(){ const fb=$("feedback"); fb.className="feedback idle";
  fb.innerHTML=`<div class="verdict"><span>Richtig – Mittwoch</span><span class="t">0,0 s</span></div>`+(prefs.how?doomsdayWay(parseISO("2000-01-01")):""); }
function resetSession(){
  stopAll(); cur=null; answered=false;
  fbIdle();
}
function answer(i){
  if(answered||!cur||counting) return;
  answered=true; cancelAnimationFrame(raf);
  const ms=Math.round(performance.now()-t0), c=monIdx(cur), ok=i===c;
  $("timer").textContent=fmtS(ms);
  pad.querySelectorAll("button[data-i]").forEach(b=>{const k=+b.dataset.i; b.disabled=true; if(k===c)b.classList.add("ok"); else if(k===i)b.classList.add("no");});
  $("leafLabel").textContent=WD[c];
  const fb=$("feedback"); fb.className="feedback";
  fb.innerHTML=`<div class="verdict"><span class="${ok?"v-good":"v-bad"}">${ok?tr("✅ Richtig – ","✅ Correct – ")+WD[c]:tr("❌ Falsch – es ist ","❌ Wrong – it’s ")+WD[c]}</span><span class="t">${fmtS(ms)}</span></div>`+(prefs.how?doomsdayWay(cur):"");
  fx(pad.querySelector(`[data-i="${ok?c:i}"]`), ok?"glow":"shake"); fx(document.querySelector(".leaf"), ok?"glow":"shake");
  const prevU=new Set(ACH.unlocked), prevS=ACH.stage;
  addAttempt([Date.now(), iso(cur), c, i, ms]);
  ACH.ach.filter(a=>a.r.ok&&!prevU.has(a.id)).forEach(a=>toast(tr("Errungenschaft","Achievement"),(EMO[a.id]||"🏅")+" "+a.name+" · "+a.desc));
  if(ACH.stage>prevS) toast(tr("Neue Stufe","New stage"),tr(`Du bist jetzt ${ACH.stages[ACH.stage].name}!`,`You are now ${ACH.stages[ACH.stage].name}!`));
  if(ok && prefs.auto) nextTimer=setTimeout(newRound, 900);
}
document.addEventListener("keydown",e=>{
  if($("v-train").hidden || e.target.matches("input,select")) return;
  if(e.key>="0"&&e.key<="6"){answer(e.key==="0"?6:+e.key-1);e.preventDefault();}
  else if(e.key===" "||e.key==="Enter"){ if(answered){newRound();e.preventDefault();} }
});

/* ---------- stats ---------- */
let period=0;
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{
  period=+b.dataset.p; document.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderStats();
}));
function filtered(){
  if(!period) return attempts;
  const start=new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()-(period-1));
  return attempts.filter(a=>a.t>=start.getTime());
}
const median = arr => { if(!arr.length) return NaN; const s=arr.slice().sort((a,b)=>a-b), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function trendSvg(list){
  const L=list.slice(-60); const W=320,H=150,pl=34,pr=8,pt=10,pb=22;
  const maxMs=Math.max(5000, ...L.map(a=>a.ms)); const top=Math.ceil(maxMs/5000)*5000;
  const step=top>30000?10000:top>15000?5000:top>6000?2000:1000;
  const x=i=>pl+(L.length<2?0:(i/(L.length-1))*(W-pl-pr)), y=v=>pt+(1-v/top)*(H-pt-pb);
  let g="";
  for(let v=0;v<=top;v+=step){ g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v/1000}s</text>`; }
  // rolling avg (5)
  const ra=L.map((_,i)=>{const s=L.slice(Math.max(0,i-4),i+1);return s.reduce((p,a)=>p+a.ms,0)/s.length});
  const path=ra.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=path+` L${x(L.length-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z`;
  const dots=L.map((a,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(a.ms).toFixed(1)}" r="2.6" fill="${a.a===a.c?"var(--good)":"var(--bad)"}" opacity=".85"/>`).join("");

    <div class="tile"><span>${tr("Bestzeit","Best time")}</span><b>${fmt(best)}</b><em>${tr("schnellste richtige Antwort","fastest correct answer")}</em></div>
    <div class="tile"><span>${tr("Serie","Streak")}</span><b>${streak}</b><em>${tr("richtig in Folge · längste","correct in a row · longest")}: ${bestStreak}</em></div>
  </div>
  ${dailyCard()}
  ${breakdown(L)}
  ${errAnalysis(L)}
  ${slowest(L)}
  <div class="card"><h2>${tr("Antwortzeit-Verlauf","Answer time trend")}</h2>${trendSvg(L)}<p class="note">${tr("Punkte: einzelne Antworten (grün richtig, rot falsch). Linie: Durchschnitt der letzten 5.","Dots: single answers (green correct, red wrong). Line: average of the last 5.")}</p></div>
  ${topConf.length?`<div class="card"><h2>${tr("Häufigste Verwechslungen","Most common mix-ups")}</h2>${topConf.map(([k,n])=>{const [c,a]=k.split(">").map(Number);return `<div class="wd-row" style="grid-template-columns:1fr auto"><span>${tr(`${WD[c]} → als <b>${WD[a]}</b> getippt`,`${WD[c]} → tapped <b>${WD[a]}</b>`)}</span><span class="num">${n}×</span></div>`}).join("")}</div>`:""}
  <div class="card"><h2>${tr("Letzte Antworten","Recent answers")}</h2><div class="recent">
    ${L.slice(-12).reverse().map(a=>{return `<div><span class="mk">${a.a===a.c?"✅":"❌"}</span><span><span class="d">${fmtD(a.d)}</span> <span class="w">${WD[a.c]}${a.a!==a.c?" ("+tr("getippt","tapped")+": "+WDS[a.a]+")":""}</span></span><span></span><span class="ms">${fmtS(a.ms)}</span></div>`}).join("")}
  </div></div>`;
}
$("statsBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-bd]"); if(b){bd=b.dataset.bd; renderStats(); return;}
  const m=e.target.closest("[data-bm]"); if(m){bm=m.dataset.bm; renderStats(); return;}
  const d=e.target.closest("[data-drill]"); if(d){drill=d.dataset.drill.split(","); drillN=drill.length; if(curView==="train"){resetSession();newRound();} else show("train");}
});
function renderDataNote(){
  const n=attempts.length;
  const where = mode==="db" ? (stale?tr("Dein Konto ist gerade nicht erreichbar. Neue Antworten werden gespeichert, sobald die Verbindung zurück ist.","Your account can’t be reached right now. New answers are saved once the connection is back."):tr("Gespeichert in deinem Claude-Konto, privat und auf allen Geräten gleich.","Saved in your Claude account, private and the same on all devices.")) : tr("Gespeichert nur in diesem Browser.","Saved in this browser only.");
  $("dataNote").textContent = tr(`${n} Antwort${n===1?"":"en"} gespeichert. `,`${n} answer${n===1?"":"s"} saved. `)+where;
  $("storeNote").textContent = where;
}

/* ---------- achievements & evolution ---------- */
function metrics(){
  const A=attempts, n=A.length; let ok=0,run=0,maxRun=0,best=Infinity,leap=0,prun=0,perfect=false;
  const wd=Array(7).fill(0), mon=Array(12).fill(0), cents=new Set(), days=new Set(), okL=[], decs=new Set(), pd={}; let early=0, late=0;
  A.forEach(a=>{ const good=a.a===a.c, d=new Date(a.t); days.add(d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()); const dn=dayNum(a.t); pd[dn]=(pd[dn]||0)+1;
    if(good){ const h=d.getHours(); if(h<8&&h>=4) early++; if(h>=22||h<4) late++; decs.add(Math.floor(+a.d.slice(0,4)/10)); }
    if(good){ ok++; run++; maxRun=Math.max(maxRun,run); best=Math.min(best,a.ms); okL.push(a.ms); wd[a.c]++;
      const Y=+a.d.slice(0,4), M=+a.d.slice(5,7); mon[M-1]++; cents.add(Math.floor(Y/100)); if(M<=2&&isLeap(Y)) leap++; }
    else run=0;
    prun=(good&&a.ms<8000)?prun+1:0; if(prun>=10) perfect=true; });
  const dk=Object.keys(pd).map(Number).sort((x,y)=>x-y); let ds=0,dr=0,pv=null; dk.forEach(k=>{dr=(pv!==null&&k===pv+1)?dr+1:1; ds=Math.max(ds,dr); pv=k;});
  return {n,ok,maxRun,best,wd,mon,leap,perfect,cents:cents.size,days:days.size,okN:okL.length,early,late,decs:decs.size,maxDay:Math.max(0,...Object.values(pd)),dayStreak:ds,
    lastAcc:N=>n>=N?A.slice(-N).filter(a=>a.a===a.c).length/N:NaN,
    lastAvg:N=>okL.length>=N?okL.slice(-N).reduce((p,v)=>p+v,0)/N:NaN};
}
const nf=v=>v.toLocaleString(loc());
const cnt=(t,v,g)=>({t,ok:v>=g,p:Math.min(v/g,1),v:`${nf(Math.min(v,g))} / ${nf(g)}`});
const fast=(t,ms,g)=>({t,ok:ms<=g,p:isFinite(ms)?Math.min(g/ms,1):0,v:isFinite(ms)?fmtS(ms):"–"});
const accC=(m,N,g)=>{const t=tr(`Trefferquote ≥ ${pct(g)} (letzte ${N})`,`Accuracy ≥ ${pct(g)} (last ${N})`), v=m.lastAcc(N);
  return isNaN(v)?{t,ok:false,p:m.n/N*.5,v:tr(`noch ${N-m.n} Antw.`,`${N-m.n} more`)}:{t,ok:v>=g,p:Math.min(v/g,1),v:pct(v)}};
const avgC=(m,N,g)=>{const t=tr(`Ø Zeit ≤ ${fmtS(g)} (letzte ${N} richtige)`,`Avg time ≤ ${fmtS(g)} (last ${N} correct)`), v=m.lastAvg(N);
  return isNaN(v)?{t,ok:false,p:m.okN/N*.5,v:tr(`noch ${N-m.okN} richtige`,`${N-m.okN} more correct`)}:{t,ok:v<=g,p:Math.min(g/v,1),v:fmtS(v)}};

const EMO={first:"🎯",n100:"💯",n500:"📚",n1000:"🏃",n2500:"🎖️",r10:"✨",r25:"🚀",r50:"🌪️",r100:"🤖",

const STAGES=[
  {nm:["Neandertaler","Neanderthal"],tx:["Der Anfang. Das erste Datum geknackt, noch mit der Keule.","The beginning. Your first date cracked, still with a club."],
   req:(m,u)=>[cnt(tr("Erste Antwort gegeben","First answer given"),m.n,1)]},

].map(o=>({req:o.req,get name(){return tr(...o.nm)},get txt(){return tr(...o.tx)}}));
let ACH={unlocked:new Set(),stage:-1,ach:[],stages:[]}, selStage=null;
function computeAch(){
  const m=metrics();
  const ach=ACHS.map(a=>({...a,r:a.get(m)}));
  const unlocked=new Set(ach.filter(a=>a.r.ok).map(a=>a.id));
  let stage=-1, prevOk=true;
  const stages=STAGES.map((st,i)=>{const req=st.req(m,unlocked.size), all=req.every(r=>r.ok), reached=prevOk&&all;
    if(reached) stage=i; prevOk=reached; return {...st,req,reached,p:req.reduce((s,r)=>s+r.p,0)/req.length};});
  ACH={unlocked,stage,ach,stages};
}
function renderAch(){
  const {ach,stages,stage,unlocked}=ACH, nextI=Math.min(stage+1,stages.length-1);
  const sel = selStage==null ? (stage>=stages.length-1?stage:nextI) : selStage;
  const total=stage>=stages.length-1?1:(stage+1+stages[nextI].p)/stages.length;
  const march=stages.map((st,i)=>{const cls=i<stage?"done":i===stage?"now":i===stage+1?"next":"locked";
    return `<button type="button" class="${cls}" data-st="${i}" aria-pressed="${i===sel}" aria-label="${tr("Stufe","Stage")} ${i+1}: ${st.name}">${fig(i)}<small>${st.name.replace("Neandertaler","Neander&shy;taler").replace("Neanderthal","Neander&shy;thal")}</small></button>`}).join("");
  const S=stages[sel], state=S.reached?["ok",tr("Erreicht","Reached")]:sel===stage+1?["go",tr("Nächstes Ziel","Next goal")]:["",tr("Gesperrt","Locked")];
  const reqs=S.req.map(r=>`<div class="req${r.ok?" ok":""}"><span class="ck">${r.ok?"✓":""}</span><span>${r.t}</span><span class="v">${r.v}</span><div class="mb"><i style="width:${Math.round(r.p*100)}%"></i></div></div>`).join("");
  const lockNote = !S.reached && sel>stage+1 ? `<p class="note">${tr(`Zuerst „${stages[sel-1].name}“ erreichen.`,`Reach “${stages[sel-1].name}” first.`)}</p>` : "";
  const ring=(p,on,sym)=>{const C=2*Math.PI*26;return `<svg viewBox="0 0 62 62" aria-hidden="true"><circle cx="31" cy="31" r="26" fill="${on?"color-mix(in srgb,var(--accent) 14%,var(--sheet))":"var(--soft)"}" stroke="${on?"var(--accent)":"var(--line)"}" stroke-width="${on?4:5}"/>`+
    (on?"":`<circle cx="31" cy="31" r="26" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 31 31)" opacity="${p>0?.8:0}"/>`)+
    `<text x="31" y="32" text-anchor="middle" dominant-baseline="central" style="font-size:26px${on?"":";filter:grayscale(1);opacity:.35"}">${sym}</text></svg>`};
  const badges=ach.map(a=>`<div class="badge${a.r.ok?"":" lock"}" title="${a.desc}">${ring(a.r.p,a.r.ok,EMO[a.id]||"🏅")}<b>${a.name}</b><span>${a.desc}</span>${a.r.ok?"":`<span class="bv">${a.r.v}</span>`}</div>`).join("");
  $("achBody").innerHTML=`
  <div class="card"><h2>${tr("Deine Entwicklung","Your evolution")}</h2>
    <div class="march">${march}</div>
    <div class="evo-bar"><i style="width:${Math.round(total*100)}%"></i></div>
    <div class="evo-meta"><span>${stage<0?tr("Noch keine Stufe","No stage yet"):tr("Stufe ","Stage ")+(stage+1)+tr(" von "," of ")+stages.length}</span><span>${stage>=stages.length-1?tr("Ziel erreicht","Goal reached"):pct(stages[nextI].p)+tr(" bis "," to ")+stages[nextI].name}</span></div>
    <p class="note">${tr("Tippe auf eine Figur, um ihre Bedingungen zu sehen.","Tap a figure to see what it takes.")}</p>
  </div>
  <div class="card">
    <div class="stage-h"><h3>${sel+1}. ${S.name}</h3><span class="tag ${state[0]}">${state[1]}</span></div>
    <p class="note" style="font-size:13px">${S.txt}</p>${lockNote}
    <div class="reqs">${reqs}</div>
  </div>
  <div class="card"><h2>${tr("Errungenschaften","Achievements")} · ${unlocked.size} / ${ach.length}</h2><div class="badges">${badges}</div></div>`;
}
$("achBody").addEventListener("click",e=>{const b=e.target.closest("[data-st]"); if(b){selStage=+b.dataset.st; renderAch();}});
const toastQ=[]; let toastBusy=false;
function toast(kind,text){ toastQ.push([kind,text]); if(!toastBusy) nextToast(); }
let toastTimer=0;
function nextToast(){ const t=$("toast"); if(!toastQ.length){toastBusy=false;return;} toastBusy=true;
  const [k,x]=toastQ.shift(); t.style.transform=""; t.style.opacity="";
  t.innerHTML=`<span><em>${k}</em>${x}<small>${tr("Wegwischen zum Schließen · Tippen für Erfolge","Swipe away to close · tap for awards")}</small></span>`; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,4500); }
function hideToast(){ const t=$("toast"); clearTimeout(toastTimer); if(!t.classList.contains("show")) return;
  t.classList.remove("show","drag"); setTimeout(()=>{t.style.transform="";t.style.opacity=""; nextToast();},300); }
{ const t=$("toast"); let sx=0, sy=0, dx=0, dy=0, on=false;
  t.addEventListener("pointerdown",e=>{ on=true; sx=e.clientX; sy=e.clientY; dx=dy=0; t.classList.add("drag"); clearTimeout(toastTimer); try{t.setPointerCapture(e.pointerId);}catch(_){} });
  t.addEventListener("pointermove",e=>{ if(!on) return; dx=e.clientX-sx; dy=Math.min(0,e.clientY-sy);
    t.style.transform=`translate(calc(-50% + ${dx}px), ${dy}px)`; t.style.opacity=String(Math.max(.2,1-Math.max(Math.abs(dx)/200,-dy/80))); });
  const end=()=>{ if(!on) return; on=false; t.classList.remove("drag");
    if(Math.abs(dx)>70||dy<-30){ t.style.transform=`translate(calc(-50% + ${dx>70?400:dx<-70?-400:0}px), ${dy<-30?-120:0}px)`; t.style.opacity="0"; hideToast(); }
    else if(Math.abs(dx)<6&&dy>-6){ t.style.transform=""; t.style.opacity=""; hideToast(); show("ach"); }
    else { t.style.transform=""; t.style.opacity=""; toastTimer=setTimeout(hideToast,3000); } };
  t.addEventListener("pointerup",end); t.addEventListener("pointercancel",end); }

/* ---------- CSV export / import ---------- */
const CSV_HEAD=()=>tr(["Zeitpunkt","Datum","Wochentag","Getippt","Richtig","Zeit (s)","ts","ms"],["Timestamp","Date","Weekday","Tapped","Correct","Seconds","ts","ms"]);
function ioMsg(t,bad){ const p=$("ioMsg"); p.hidden=false; p.textContent=t; p.style.color=bad?"var(--bad)":""; }
function buildCSV(){
  const z=n=>String(n).padStart(2,"0");
  const rows=attempts.map(a=>{const d=new Date(a.t);
    return [`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`,
      a.d, WD[a.c], WD[a.a], a.a===a.c?tr("ja","yes"):tr("nein","no"), (a.ms/1000).toLocaleString(loc(),{minimumFractionDigits:1,maximumFractionDigits:3}), a.t, a.ms].join(";");});
  return "﻿"+[CSV_HEAD().join(";"),...rows].join("\r\n")+"\r\n";
}
async function exportCSV(){
  if(!attempts.length){ ioMsg(tr("Noch keine Antworten zum Exportieren.","No answers to export yet.")); return; }
  const csv=buildCSV(), d=new Date(), name=`wochentag-trainer-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.csv`;
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:csv}); ioMsg(tr(`${attempts.length} Antworten exportiert.`,`${attempts.length} answers exported.`)); }
    catch(e){ if(!e||e.code!=="declined") ioMsg(tr("Export hier nicht möglich.","Export isn’t possible here."),true); } return; }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  try{ const file=new File([blob],name,{type:"text/csv"});
    if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); ioMsg(tr(`${attempts.length} Antworten exportiert.`,`${attempts.length} answers exported.`)); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); ioMsg(tr(`${attempts.length} Antworten exportiert.`,`${attempts.length} answers exported.`));
}
function importCSV(text){
  text=text.replace(/^﻿/,""); const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error(tr("Die Datei enthält keine Antworten.","The file contains no answers."));
  const sep=lines[0].includes(";")?";":",", head=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  const col=(...n)=>{for(const x of n){const i=head.indexOf(x); if(i>=0) return i;} return -1;}, iT=col("ts"), iD=col("datum","date"), iW=col("wochentag","weekday"), iG=col("getippt","tapped"), iM=col("ms");
  const wIdx=v=>{const x=(v||"").toLowerCase(); for(const L of ["de","en"]){const i=I18N[L].WD.findIndex(w=>w.toLowerCase()===x); if(i>=0) return i;} return -1;};
  if([iT,iD,iW,iG,iM].some(i=>i<0)) throw new Error(tr("Unbekanntes Format. Bitte eine CSV aus „CSV exportieren“ verwenden.","Unknown format. Please use a CSV from “Export CSV”."));
  const have=new Set(attempts.map(a=>a.t)), touched=new Set(); let add=0, skip=0, bad=0;
  for(const line of lines.slice(1)){
    const c=line.split(sep).map(v=>v.trim().replace(/^"|"$/g,""));
    const t=+c[iT], d=c[iD], w=wIdx(c[iW]), g=wIdx(c[iG]), ms=+c[iM];
    if(!isFinite(t)||!/^\d{4}-\d{2}-\d{2}$/.test(d)||w<0||g<0||!isFinite(ms)){ bad++; continue; }
    if(have.has(t)){ skip++; continue; }
    const r=[t,d,w,g,Math.round(ms)], k=keyOf(t); (months[k] ||= []).push(r); if(mode==="db") pending.push(r);
    have.add(t); touched.add(k); add++;
  }
  if(add){ saveLocal(); touched.forEach(k=>persist(k)); rebuild(); }
  return {add,skip,bad};
}
$("csvOut").addEventListener("click",exportCSV);
$("csvIn").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file) return;
  try{ const r=importCSV(await file.text());
    ioMsg(tr(`${r.add} Antworten importiert`,`${r.add} answers imported`)+(r.skip?tr(`, ${r.skip} waren schon vorhanden`,`, ${r.skip} were already there`):"")+(r.bad?tr(`, ${r.bad} Zeilen übersprungen`,`, ${r.bad} lines skipped`):"")+"."); }
  catch(err){ ioMsg(err.message||tr("Import fehlgeschlagen.","Import failed."),true); }
});
